name: VibeLab / Evolución del agente

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: vibelab-readme-main
  cancel-in-progress: false

jobs:
  evolve:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'LAB:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Validate game engine
        run: python3 game/vibelab.py --check
      - name: Evolve fictional agent and update profile
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_ACTOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          python3 game/vibelab.py --title "$ISSUE_TITLE" --actor "$ISSUE_ACTOR"
      - name: Publish game state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/lab-state.json assets/agent-evolution.svg
          git commit -m "game: evolución de vibe coder #${{ github.event.issue.number }} [skip ci]"
          git push origin HEAD:main
      - name: Close processed move
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --reason completed --comment "Jugada aplicada. El agente del README subió de nivel o amplió su inventario. Volvé al perfil y actualizá la página."
