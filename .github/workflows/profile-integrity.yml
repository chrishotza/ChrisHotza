name: Profile README integrity
on:
  push:
    paths:
      - README.md
      - assets/**
      - scripts/check_profile.py
      - .github/workflows/profile-integrity.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/check_profile.py
      - .github/workflows/profile-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check profile cards, SVG integrity and bilingual descriptions
        run: python scripts/check_profile.py
